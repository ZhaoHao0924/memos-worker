name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "6d41566b-53d3-4d64-80f4-6a22dc2daa15"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "cb56a2297980498eadf01e3b21fdd85c"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "YOUR_R2_BUCKET_NAME"
preview_bucket_name = "notes-files-preview"
